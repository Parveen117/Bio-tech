name: b01-audit
on: [push, pull_request]
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install numpy pytest
      - run: python -m pytest tests -q
      - name: regenerate certificate and diff against pinned
        run: |
          python campaigns/B01_PLUCKER_BIO_RESPONSE/run_b01.py
          python campaigns/B02_CUT_SQUARE_RESPONSE/run_b02.py
          git diff --exit-code results/B01_CERTIFICATE.json results/B02_CERTIFICATE.json
